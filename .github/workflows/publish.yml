name: Publish to Chrome Web Store

# softprops/action-gh-release still declares Node 20; opt into the runner Node 24 runtime until it updates.
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        branches:
            - main
        paths:
            - "src/manifest.json"
    workflow_dispatch:

jobs:
    check:
        name: Check manifest version change
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            should_publish: ${{ steps.diff.outputs.changed }}
            version: ${{ steps.diff.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 2

            - name: Detect manifest version change
              id: diff
              run: |
                  VERSION=$(python3 -c 'import json; print(json.load(open("src/manifest.json"))["version"])')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "Manual run: publishing version $VERSION"
                    exit 0
                  fi

                  if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "No parent commit; publishing version $VERSION"
                    exit 0
                  fi

                  PREV=$(git show HEAD~1:src/manifest.json 2>/dev/null | python3 -c 'import sys, json; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
                  if [ -z "$PREV" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "No previous manifest; publishing version $VERSION"
                    exit 0
                  fi

                  if [ "$VERSION" != "$PREV" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "Version changed: $PREV -> $VERSION"
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                    echo "manifest.json updated but version unchanged ($VERSION); skip publish and release"
                  fi

    publish:
        name: Package, publish, and release
        needs: check
        if: needs.check.outputs.should_publish == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Zip extension source
              run: |
                  mkdir -p dist
                  cd src
                  zip -r ../dist/extension.zip .
                  cd ..
                  echo "Created dist/extension.zip"

            - name: Upload to Chrome Web Store
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
              run: |
                  set -euo pipefail

                  # Exchange refresh token for an access token
                  HTTP_CODE=$(curl -s \
                    -o /tmp/token.json \
                    -w "%{http_code}" \
                    -X POST https://oauth2.googleapis.com/token \
                    -d "client_id=${CHROME_CLIENT_ID}&client_secret=${CHROME_CLIENT_SECRET}&refresh_token=${CHROME_REFRESH_TOKEN}&grant_type=refresh_token")
                  if [ "${HTTP_CODE}" != "200" ]; then
                    echo "Token exchange failed (HTTP ${HTTP_CODE}): $(cat /tmp/token.json)" >&2
                    exit 1
                  fi
                  ACCESS_TOKEN=$(jq -re '.access_token' /tmp/token.json)

                  # Upload the extension zip to the Chrome Web Store
                  HTTP_CODE=$(curl -s \
                    -o /tmp/upload.json \
                    -w "%{http_code}" \
                    -X PUT \
                    "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}" \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "x-goog-api-version: 2" \
                    -H "Content-Type: application/zip" \
                    --data-binary "@dist/extension.zip")
                  echo "Upload (HTTP ${HTTP_CODE}): $(cat /tmp/upload.json)"
                  if [ "${HTTP_CODE}" -ge 400 ]; then
                    echo "Upload HTTP error (${HTTP_CODE})" >&2; exit 1
                  fi
                  STATE=$(jq -re '.uploadState // ""' /tmp/upload.json)
                  if [ "${STATE}" = "FAILURE" ] || [ "${STATE}" = "NOT_FOUND" ]; then
                    echo "Upload failed (${STATE})" >&2; exit 1
                  fi

                  # Publish the uploaded version
                  HTTP_CODE=$(curl -s \
                    -o /tmp/publish.json \
                    -w "%{http_code}" \
                    -X POST \
                    "https://www.googleapis.com/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}/publish?publishTarget=default" \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "x-goog-api-version: 2" \
                    -H "Content-Length: 0")
                  echo "Publish (HTTP ${HTTP_CODE}): $(cat /tmp/publish.json)"
                  if [ "${HTTP_CODE}" -ge 400 ]; then
                    echo "Publish HTTP error (${HTTP_CODE})" >&2; exit 1
                  fi

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2.6.1
              with:
                  tag_name: v${{ needs.check.outputs.version }}
                  name: v${{ needs.check.outputs.version }}
                  files: dist/extension.zip
                  generate_release_notes: true
                  target_commitish: ${{ github.sha }}
