name: Publish to Chrome Web Store

# Third-party actions still declare Node 20; opt into the runner Node 24 runtime until they update.
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    push:
        branches:
            - main
        paths:
            - "src/manifest.json"
    workflow_dispatch:

jobs:
    check:
        name: Check manifest version change
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            should_publish: ${{ steps.diff.outputs.changed }}
            version: ${{ steps.diff.outputs.version }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 2

            - name: Detect manifest version change
              id: diff
              run: |
                  VERSION=$(python3 -c 'import json; print(json.load(open("src/manifest.json"))["version"])')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "Manual run: publishing version $VERSION"
                    exit 0
                  fi

                  if ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "No parent commit; publishing version $VERSION"
                    exit 0
                  fi

                  PREV=$(git show HEAD~1:src/manifest.json 2>/dev/null | python3 -c 'import sys, json; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
                  if [ -z "$PREV" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "No previous manifest; publishing version $VERSION"
                    exit 0
                  fi

                  if [ "$VERSION" != "$PREV" ]; then
                    echo "changed=true" >> $GITHUB_OUTPUT
                    echo "Version changed: $PREV -> $VERSION"
                  else
                    echo "changed=false" >> $GITHUB_OUTPUT
                    echo "manifest.json updated but version unchanged ($VERSION); skip publish and release"
                  fi

    publish:
        name: Package, publish, and release
        needs: check
        if: needs.check.outputs.should_publish == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Validate Chrome Web Store secrets
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
              run: |
                  set -euo pipefail

                  missing=()
                  for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
                    if [ -z "${!name:-}" ]; then
                      missing+=("$name")
                    fi
                  done

                  if [ "${#missing[@]}" -gt 0 ]; then
                    printf '::error::Missing required secret(s): %s\n' "${missing[*]}"
                    exit 1
                  fi

            - name: Zip extension source
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  cd src
                  zip -r ../dist/extension.zip .
                  cd ..
                  echo "Created dist/extension.zip"

            - name: Refresh Chrome Web Store access token
              id: chrome-token
              env:
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
              run: |
                  set -euo pipefail

                  token_response=$(curl --silent --show-error \
                    -X POST https://oauth2.googleapis.com/token \
                    --data-urlencode "client_id=${CHROME_CLIENT_ID}" \
                    --data-urlencode "client_secret=${CHROME_CLIENT_SECRET}" \
                    --data-urlencode "refresh_token=${CHROME_REFRESH_TOKEN}" \
                    --data-urlencode "grant_type=refresh_token" \
                    --write-out "\n%{http_code}" || true)

                  http_status=$(tail -n1 <<<"$token_response")
                  token_response=$(head -n -1 <<<"$token_response")

                  if [ "$http_status" != "200" ]; then
                    google_error=$(jq -r '.error // "unknown"' <<<"$token_response" 2>/dev/null || echo "unknown")
                    google_desc=$(jq -r '.error_description // ""' <<<"$token_response" 2>/dev/null || true)
                    echo "::error::Token refresh failed (HTTP $http_status): $google_error — $google_desc"
                    echo "$token_response"
                    exit 1
                  fi

                  access_token=$(jq -r '.access_token // empty' <<<"$token_response")
                  if [ -z "$access_token" ]; then
                    echo "::error::Chrome Web Store token refresh did not return an access token."
                    echo "$token_response"
                    exit 1
                  fi

                  echo "::add-mask::$access_token"
                  echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

            - name: Upload to Chrome Web Store
              env:
                  ACCESS_TOKEN: ${{ steps.chrome-token.outputs.access_token }}
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
              run: |
                  set -euo pipefail

                  item_name="publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}"
                  upload_url="https://chromewebstore.googleapis.com/upload/v2/${item_name}:upload"
                  status_url="https://chromewebstore.googleapis.com/v2/${item_name}:fetchStatus"

                  upload_response=$(curl --silent --show-error --fail-with-body \
                    -X POST \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "X-Goog-Upload-Protocol: raw" \
                    -H "X-Goog-Upload-File-Name: extension.zip" \
                    --data-binary @dist/extension.zip \
                    "${upload_url}")

                  upload_state=$(jq -r '.uploadState // empty' <<<"$upload_response")
                  case "$upload_state" in
                    SUCCEEDED)
                      echo "Chrome Web Store upload succeeded."
                      ;;
                    IN_PROGRESS)
                      echo "Chrome Web Store upload is processing; polling status."
                      status_response=""
                      for attempt in {1..60}; do
                        sleep 5
                        status_response=$(curl --silent --show-error --fail-with-body \
                          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                          "${status_url}")
                        upload_state=$(jq -r '.lastAsyncUploadState // empty' <<<"$status_response")
                        if [ "$upload_state" != "IN_PROGRESS" ] && [ -n "$upload_state" ]; then
                          break
                        fi
                      done

                      if [ "$upload_state" != "SUCCEEDED" ]; then
                        echo "::error::Chrome Web Store upload did not finish successfully."
                        echo "$status_response"
                        exit 1
                      fi
                      ;;
                    *)
                      echo "::error::Chrome Web Store upload failed."
                      echo "$upload_response"
                      exit 1
                      ;;
                  esac

            - name: Publish to Chrome Web Store
              env:
                  ACCESS_TOKEN: ${{ steps.chrome-token.outputs.access_token }}
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
              run: |
                  set -euo pipefail

                  item_name="publishers/${CHROME_PUBLISHER_ID}/items/${CHROME_EXTENSION_ID}"
                  publish_response=$(curl --silent --show-error --fail-with-body \
                    -X POST \
                    -H "Authorization: Bearer ${ACCESS_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d '{"publishType":"DEFAULT_PUBLISH"}' \
                    "https://chromewebstore.googleapis.com/v2/${item_name}:publish")

                  publish_state=$(jq -r '.state // empty' <<<"$publish_response")
                  case "$publish_state" in
                    PENDING_REVIEW|PUBLISHED|PUBLISHED_TO_TESTERS|STAGED)
                      echo "Chrome Web Store publish request accepted with state: $publish_state"
                      ;;
                    *)
                      echo "::error::Chrome Web Store publish returned an unexpected state."
                      echo "$publish_response"
                      exit 1
                      ;;
                  esac

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2.6.1
              with:
                  tag_name: v${{ needs.check.outputs.version }}
                  name: v${{ needs.check.outputs.version }}
                  files: dist/extension.zip
                  generate_release_notes: true
                  target_commitish: ${{ github.sha }}
